# Local one-command setup:
#
#   docker compose up --build
#   open http://localhost:3000
#
# The backend image is linux/amd64 only (open-source PyMOL ships no arm64
# wheel), so on Apple Silicon it runs under emulation. A full pipeline run
# takes minutes; that is the pipeline, not the emulation.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    ports:
      - "8000:8000"
    environment:
      # Artefacts are written here and served from GET /files/...
      ORTHOSCOPE_DATA_DIR: /data
      # Origins allowed to call the API, comma-separated.
      ORTHOSCOPE_CORS_ORIGINS: http://localhost:3000
    volumes:
      - orthoscope-data:/data

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Inlined into the client bundle at build time — the browser calls the
        # API directly, so this must be reachable from the host, not "api".
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  orthoscope-data:
